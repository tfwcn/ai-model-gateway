# 模型组别名配置 - 每个别名对应一组 model selector，系统取并集
# selector 格式: "all"(全部), 平台名, 或 platform|model_name
# all_aliases:
#   fast-models:
#     - "modelscope"
#     - "openrouter"

# ModelScope 免费模型配置示例
# 使用网页爬虫从 modelscope.cn 获取热门免费模型列表
modelscope:
  baseUrl: "https://api-inference.modelscope.cn/v1"
  apiKey: "${MODELSCOPE_API_KEY}"
  plugin:
    code: "plugin.modelscope"
    cache_timeout: 3600 # 缓存过期时间（秒），默认1小时
    args:
      # ModelScope 免费模型爬虫配置
      scrape_url: "https://www.modelscope.cn/models?filter=inference_type&page=1&sort=default&tabKey=task" # 爬虫URL（必填）
      max_models: 10 # 获取的最大模型数量
      scraper_timeout: 60 # 爬虫超时时间（秒）
      headless: true # 无头模式运行浏览器

      # 定时任务配置
      enable_scheduled_task: true # 是否启用定时任务
      schedule_cron: "0 2 * * *" # cron表达式，每天凌晨2点执行

      # 工具调用能力测试配置
      enable_tool_capability_test: true
      max_concurrent_tests: 1 # 串行测试，避免限流
      test_timeout_seconds: 60
  models: [] # 静态配置的模型（可选）
  # 黑名单：爬虫抓取但无法使用的模型，支持 * 通配符匹配
  # 示例：
  #   - "Qwen/Qwen2.5-7B-Instruct"  # 精确匹配
  #   - "iic/*"                       # 匹配 iic/ 开头的所有模型
  blacklist: []
  timeout: 10
  weight: 1
  enabled: true
  quota_period: "daily" # 每日额度刷新
  retry_count: 3 # 单个模型调用失败时的重试次数，默认3次

