<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>AI Model Gateway 管理台</title>
  <!-- 内联图标：省一次 favicon.ico 的 404，也和左上角 logo 一致 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232f6feb'/%3E%3Ctext x='32' y='43' font-family='system-ui,sans-serif' font-size='26' font-weight='700' fill='%23ffffff' text-anchor='middle'%3EGW%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">GW</span>
      <span class="title">AI Model Gateway 管理台</span>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab" data-view="usage">用量与性能</button>
      <button class="tab" data-view="audit">审计明细</button>
      <button class="tab" data-view="users">用户密钥</button>
      <button class="tab" data-view="config">模型配置</button>
      <button class="tab" data-view="backups">备份与回滚</button>
    </nav>
    <form class="keybox" id="keybox">
      <label for="apikey">管理密钥</label>
      <input id="apikey" type="password" placeholder="GATEWAY_API_KEY" autocomplete="off">
      <button type="submit">连接</button>
    </form>
    <!-- 消息按钮与最近消息下拉：放在顶栏，不占页面底部的位置 -->
    <div class="notice-menu" id="notice-menu"></div>
  </header>

  <main id="main">
    <div id="view"></div>
  </main>

  <!-- 右下角提示坞：只放浮动提示，消息按钮与列表在顶栏 -->
  <div id="toast-dock" class="toast-dock"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
